AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Revia backend with Cognito auth, persona storage, chat history, API Gateway REST API, Lambda, DynamoDB, and S3-ready resources.

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key used for persona chat generation.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 20
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        COGNITO_USER_POOL_ID: !Ref ReviaUserPool
        COGNITO_CLIENT_ID: !Ref ReviaUserPoolClient
        USERS_TABLE: !Ref UsersTable
        AGENTS_TABLE: !Ref AgentsTable
        MESSAGES_TABLE: !Ref MessagesTable
        MEMORIES_TABLE: !Ref MemoriesTable
        UPLOADS_TABLE: !Ref UploadsTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        COGNITO_AUTO_CONFIRM: 'false'
        GROQ_API_KEY: !Ref GroqApiKey
        GROQ_MODEL: 'llama-3.3-70b-versatile'
        GROQ_FALLBACK_MODEL: 'llama-3.1-8b-instant'
        DEFAULT_MODEL_PROVIDER: 'groq'
        DEFAULT_MODEL_NAME: 'llama-3.3-70b-versatile'
        MEMORY_SUMMARY_INTERVAL: '6'
        MEMORY_RETRIEVAL_LIMIT: '25'

Resources:
  ReviaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: revia-phase1-api
      StageName: dev
      Cors:
        AllowMethods: "'OPTIONS,POST,GET,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  ReviaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: revia-phase1-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  ReviaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: revia-phase1-app-client
      UserPoolId: !Ref ReviaUserPool
      GenerateSecret: false
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: days
        IdToken: days
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-users-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  AgentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-agents-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: agentId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: agentId
          KeyType: RANGE

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-messages-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: messageKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: messageKey
          KeyType: RANGE

  MemoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-memories-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: memoryKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: memoryKey
          KeyType: RANGE

  UploadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-uploads-meta-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: fileId
          KeyType: RANGE

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/signup.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
              Resource: "*"
      Events:
        SignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/signup
            Method: post

  VerifySignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/verify-signup.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmSignUp
              Resource: "*"
      Events:
        VerifySignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/signup/verify
            Method: post

  ResendSignupOtpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/resend-signup-otp.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ResendConfirmationCode
              Resource: "*"
      Events:
        ResendSignupOtpApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/signup/resend-otp
            Method: post

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/login.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
              Resource: "*"
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/login
            Method: post

  ForgotPasswordRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/forgot-password-request.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ForgotPassword
              Resource: "*"
      Events:
        ForgotPasswordRequestApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/forgot-password/request
            Method: post

  ForgotPasswordConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/forgot-password-confirm.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmForgotPassword
              Resource: "*"
      Events:
        ForgotPasswordConfirmApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/forgot-password/confirm
            Method: post

  ChangePasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/change-password.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ChangePassword
              Resource: "*"
      Events:
        ChangePasswordApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/change-password
            Method: post

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/me.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        MeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/me
            Method: get

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/users/update-profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        UpdateProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /users/me
            Method: put

  DeleteAccountRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/users/delete-account-request.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUserAttributeVerificationCode
              Resource: "*"
      Events:
        DeleteAccountRequestApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /users/delete-account/request
            Method: post

  DeleteAccountConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/users/delete-account-confirm.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:VerifyUserAttribute
                - cognito-idp:DeleteUser
              Resource: "*"
      Events:
        DeleteAccountConfirmApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /users/delete-account/confirm
            Method: post

  CreateAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/agents/create-agent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
      Events:
        CreateAgentApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /agents
            Method: post

  ListAgentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/agents/list-agents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AgentsTable
      Events:
        ListAgentsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /agents
            Method: get

  GetAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/agents/get-agent.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AgentsTable
      Events:
        GetAgentApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /agents/{id}
            Method: get

  UpdateAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/agents/update-agent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
      Events:
        UpdateAgentApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /agents/{id}
            Method: put

  DeleteAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/agents/delete-agent.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
      Events:
        DeleteAgentApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /agents/{id}
            Method: delete

  CreateMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/messages/create-message.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref AgentsTable
      Events:
        CreateMessageApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /messages
            Method: post

  ListMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/messages/list-messages.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
      Events:
        ListMessagesApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /messages/{agentId}
            Method: get

  CreateUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/uploads/create-upload.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UploadsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::${UploadsBucket}/*
      Events:
        CreateUploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /upload
            Method: post

  CreatePersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/personas/create-persona.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${UploadsBucket}/*
      Events:
        CreatePersonaApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /personas
            Method: post

  ListPersonasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/personas/list-personas.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AgentsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${UploadsBucket}/*
      Events:
        ListPersonasApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /personas
            Method: get

  GetPersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/personas/get-persona.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AgentsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${UploadsBucket}/*
      Events:
        GetPersonaApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /personas/{id}
            Method: get

  UpdatePersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/personas/update-persona.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub arn:aws:s3:::${UploadsBucket}/*
      Events:
        UpdatePersonaApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /personas/{id}
            Method: put

  DeletePersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/personas/delete-persona.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoriesTable
      Events:
        DeletePersonaApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /personas/{id}
            Method: delete

  SendChatMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/chat/send-message.handler
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
          GROQ_MODEL: 'llama-3.3-70b-versatile'
          GROQ_FALLBACK_MODEL: 'llama-3.1-8b-instant'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoriesTable
      Events:
        SendChatMessageApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /chat/send
            Method: post

  GetChatHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/chat/get-history.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MessagesTable
      Events:
        GetChatHistoryApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /chat/history/{conversationId}
            Method: get

Outputs:
  ApiBaseUrl:
    Description: Base URL for the API Gateway stage
    Value: !Sub https://${ReviaApi}.execute-api.${AWS::Region}.amazonaws.com/dev

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref ReviaUserPool

  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref ReviaUserPoolClient

  UsersTableName:
    Description: DynamoDB table for minimal profiles
    Value: !Ref UsersTable

  AgentsTableName:
    Description: DynamoDB table for persona agents
    Value: !Ref AgentsTable

  MessagesTableName:
    Description: DynamoDB table for chat history messages
    Value: !Ref MessagesTable

  MemoriesTableName:
    Description: DynamoDB table for lightweight memory summaries
    Value: !Ref MemoriesTable

  UploadsTableName:
    Description: DynamoDB table for upload metadata
    Value: !Ref UploadsTable

  UploadsBucketName:
    Description: S3 bucket reserved for future uploads
    Value: !Ref UploadsBucket
