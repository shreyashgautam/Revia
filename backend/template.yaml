AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Revia Phase 1 backend with Cognito, API Gateway REST API, Lambda, DynamoDB, and S3-ready resources.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        COGNITO_USER_POOL_ID: !Ref ReviaUserPool
        COGNITO_CLIENT_ID: !Ref ReviaUserPoolClient
        USERS_TABLE: !Ref UsersTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        COGNITO_AUTO_CONFIRM: 'true'

Resources:
  ReviaApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: revia-phase1-api
      StageName: dev
      Cors:
        AllowMethods: "'OPTIONS,POST,GET,PUT'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  ReviaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: revia-phase1-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  ReviaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: revia-phase1-app-client
      UserPoolId: !Ref ReviaUserPool
      GenerateSecret: false
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: days
        IdToken: days
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: revia-users-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/signup.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminConfirmSignUp
              Resource: "*"
      Events:
        SignupApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/signup
            Method: post

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/login.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
              Resource: "*"
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/login
            Method: post

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/me.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        MeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /auth/me
            Method: get

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/users/update-profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        UpdateProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref ReviaApi
            Path: /users/me
            Method: put

Outputs:
  ApiBaseUrl:
    Description: Base URL for the API Gateway stage
    Value: !Sub https://${ReviaApi}.execute-api.${AWS::Region}.amazonaws.com/dev

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref ReviaUserPool

  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref ReviaUserPoolClient

  UsersTableName:
    Description: DynamoDB table for minimal profiles
    Value: !Ref UsersTable

  UploadsBucketName:
    Description: S3 bucket reserved for future uploads
    Value: !Ref UploadsBucket
